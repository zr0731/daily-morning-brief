name: daily-morning-brief

on:
  schedule:
    # 北京时间每天 07:00 = UTC 23:00（前一天）
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate + PushPlus
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          REPO_WEB_URL: https://github.com/${{ github.repository }}
        run: python run.py

      - name: Commit archive & feedback stub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive feedback
          git diff --staged --quiet || git commit -m "chore: archive morning brief $(date -u +%Y-%m-%d)"
          # 手机端可能刚改过 feedback，推送前先 rebase，避免覆盖打分
          git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin main || true
          git push
